# The tests on every pull request and push to main. No secrets: pull requests from forks run here too.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # One command per step: on Windows a step runs in PowerShell, which takes the last command's
      # exit code, so a failed Python run followed by a passing Node run would still show green.
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Test the window's page
        run: node tests/test_ui.js
