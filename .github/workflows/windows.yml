# The Windows package: built on every v* tag (and by hand), attached to the tag's release.
name: windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the tags: a build by hand is numbered after the latest one (build.ps1)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # One command per step: on Windows a step runs in PowerShell, which takes the last command's
      # exit code, so a failed Python run followed by a passing Node run would still show green.
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Test the window's page
        run: node tests/test_ui.js
      - name: Build
        env:  # secrets, so the addresses stay out of the source and the public logs
          ST_SERVER: ${{ secrets.ST_SERVER }}
          ST_SITE: ${{ secrets.ST_SITE }}
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - name: Check the package
        run: |
          if (-not (Test-Path build\dist\stzb-warroom\_internal\stzb_warroom\ui\index.html)) { throw "the window's page is missing" }
          if (-not (Test-Path build\dist\stzb-warroom\stzb-warroom.exe)) { throw "the exe is missing" }
          if (-not (Test-Path build\dist\stzb-warroom\config.json)) { throw "config.json is missing" }
          if (-not (Test-Path build\dist\stzb-warroom\window\stzb-window.exe)) { throw "the window is missing" }
          if (-not (Test-Path build\dist\stzb-warroom\window\resources\app\main.js)) { throw "the window's app is missing" }
          $release = Get-Content build\release.json | ConvertFrom-Json
          $config = Get-Content build\dist\stzb-warroom\config.json | ConvertFrom-Json
          if (-not $release.runtime -or $config.runtime -ne $release.runtime) { throw "the runtime is missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: stzb-warroom-windows
          path: build/dist/stzb-warroom
      - uses: actions/upload-artifact@v4
        with:
          name: stzb-warroom-release
          path: |
            build/stzb-warroom-app.zip
            build/release.json
      # The release page says what the annotated tag says: its first line is the title, the rest the
      # notes for players (git tag -a vX.Y.Z -F notes.txt). Generated notes are only a changelog link.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          title=$(git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)')
          git for-each-ref "refs/tags/$TAG" --format='%(contents:body)' > build/notes.md
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ] || ! grep -q '[^[:space:]]' build/notes.md; then
            echo "the tag has no release notes: make it with git tag -a $TAG -F <notes>" >&2
            exit 1
          fi
          gh release create "$TAG" build/stzb-warroom-windows.zip build/stzb-warroom-app.zip build/release.json \
            --title "$title" --notes-file build/notes.md
